name: Build and test container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: default, file: Dockerfile, suffix: ''}
          - {variant: rootless, file: rootless.Dockerfile, suffix: '-rootless'}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Latest GYB release
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gyb-release-info >> "$GITHUB_OUTPUT"
      -
        name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: GYB_VERSION=${{ steps.release_info.outputs.tag }}
          load: true
          platforms: linux/amd64
          tags: awbn/gyb-test:ci${{ matrix.suffix }}
      -
        name: Test
        run: ./test.sh --only ${{ matrix.variant }} awbn/gyb-test:ci
